<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="OFF4Apps — simple apps for a better tomorrow.">
  <title>OFF4Apps</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">OFF4Apps</div>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to night mode">
    <span class="sun">☀</span><span class="moon">☾</span>
  </button>
</header>

<main>
  <section class="cinematic-track" id="cinematicTrack">
    <div class="cinematic-stage">
      <div class="ambient ambient-blue"></div>
      <div class="ambient ambient-pink"></div>
      <div class="floor-glow"></div>
      <div class="vignette" id="vignette"></div>

      <div class="camera-space">
        <div class="laptop-rig" id="laptopRig">
          <div class="laptop">
            <div class="lid">
              <div class="camera-dot"></div>
              <div class="screen">
                <div class="screen-content">
                  <section class="panel active" data-panel="home">
                    <div class="screen-brand">OFF4Apps</div>
                    <div class="tagline">SIMPLE APPS. A BETTER TOMORROW.</div>
                    <div class="choices">
                      <button class="choice offline" data-open="offline">Offline Apps</button>
                      <button class="choice online" data-open="online">Online Apps</button>
                    </div>
                  </section>

                  <section class="panel" data-panel="offline">
                    <div class="panel-title">Offline Apps</div>
                    <p>Offline-first applications will be showcased here.</p>
                    <button class="back" data-open="home">Back</button>
                  </section>

                  <section class="panel" data-panel="online">
                    <div class="panel-title">Online Apps</div>
                    <p>Connected applications will be showcased here.</p>
                    <button class="back" data-open="home">Back</button>
                  </section>
                </div>
                <div class="reflection"></div>
              </div>
            </div>
            <div class="hinge"></div>
            <div class="base"><div class="trackpad"></div></div>
          </div>
          <div class="shadow"></div>
        </div>
      </div>

      <div class="scroll-cue" id="scrollCue">
        <span>SCROLL</span>
        <i></i>
      </div>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
